services:
  db:
    image: postgres:17-alpine
    container_name: ct-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-ct_user}
      # 密碼從 .env 讀。沒有 .env 時退回 devpassword 只是為了讓
      # 「clone 下來立刻能跑」這件事成立——正式環境一定要設 .env。
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: career_toolkit
    ports:
      # 綁在 127.0.0.1，不是預設的 0.0.0.0。
      #
      # 只寫 "5435:5432" 的話 Docker 會綁到所有網路介面，同一個網段的人
      # （咖啡廳 wifi、公司內網）都連得到這個資料庫。密碼又是寫死在這個檔案裡、
      # 而且會公開在 GitHub 上的 devpassword——兩件事加起來就從「無所謂」
      # 變成「有人真的連得進來」。
      #
      # 本機的 psql / DBeaver 一樣連得到，因為它們也是從 127.0.0.1 連。
      # 用 5435 是因為這台機器的 5432 被本機安裝的 PostgreSQL 佔用了。
      - "127.0.0.1:5435:5432"
    volumes:
      - ct-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ct_user -d career_toolkit"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: ct-app
    ports:
      # 綁 127.0.0.1，不是預設的 0.0.0.0。
      #
      # cloudflared 是從本機連過來的，所以 localhost 就夠。綁到所有介面的話，
      # 同網段的人可以直接連 8080 —— 那等於繞過了 Cloudflare 這一層
      # （包括之後可能加上的 Cloudflare Access 門禁）。
      - "127.0.0.1:8080:8080"
    environment:
      # host 是 db 不是 localhost——在 compose 網路裡 service 名稱就是 hostname，
      # localhost 在容器內指的是容器自己。這個坑幾乎每個人都會踩一次。
      # port 是 5432（容器內部），不是 5435（對主機映射出去的那個）。
      DB_URL: jdbc:postgresql://db:5432/career_toolkit
      DB_USER: ${DB_USER:-ct_user}
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      STORAGE_ROOT: /var/lib/career-toolkit/files
      SELECTION_DAILY_QUOTA: ${SELECTION_DAILY_QUOTA:-200}
      SQL_LOG_LEVEL: ${SQL_LOG_LEVEL:-info}
    healthcheck:
      # Cloudflare Tunnel 打的是同一個端點。這裡也用它，
      # 確保「compose 說健康」跟「tunnel 說健康」是同一個判斷標準。
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      # 上傳的履歷檔。用 named volume 而不是 bind mount，
      # 這樣 docker compose down && up 之後檔案還在，但也不會弄髒 repo 目錄。
      - ct-files:/var/lib/career-toolkit/files
    depends_on:
      db:
        # 只寫 depends_on: [db] 不夠——那只保證容器「啟動」，
        # 不保證 PostgreSQL 已經可以接受連線。必須搭配 db 的 healthcheck。
        condition: service_healthy

volumes:
  ct-pgdata:
  ct-files:
